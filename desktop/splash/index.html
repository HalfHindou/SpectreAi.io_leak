<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 320px;
      background: linear-gradient(168deg, #07060a 0%, #09080d 35%, #09090b 70%, #020103 100%);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      overflow: hidden;
      -webkit-app-region: drag;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    body.fade-out { opacity: 0; }

    /* ── Orbit animation ── */
    .orbit-container {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 0.4s ease 0.1s forwards;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
      animation: spin 4s linear infinite;
    }

    .ring-1 {
      width: 90px;
      height: 90px;
      border-top-color:   rgba(139,92,246,0.5);
      border-right-color: rgba(139,92,246,0.15);
      animation-duration: 3s;
    }

    .ring-2 {
      width: 74px;
      height: 74px;
      border-bottom-color: rgba(6,182,212,0.4);
      border-left-color:   rgba(6,182,212,0.1);
      animation-duration: 2.2s;
      animation-direction: reverse;
    }

    .ring-3 {
      width: 58px;
      height: 58px;
      border-top-color:   rgba(139,92,246,0.2);
      border-right-color: rgba(139,92,246,0.6);
      animation-duration: 5s;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .logo-mark {
      position: absolute;
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(6,182,212,0.1));
      border: 1px solid rgba(139,92,246,0.4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 20px rgba(139,92,246,0.25),
        inset 0 1px 0 rgba(255,255,255,0.1);
      opacity: 0;
      transform: scale(0.7);
      animation:
        markIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.35s forwards,
        glow 1.8s ease-in-out 0.85s infinite;
    }

    .logo-mark img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      opacity: 0.95;
    }

    @keyframes markIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes glow {
      0%,100% { box-shadow: 0 0 20px rgba(139,92,246,0.25), inset 0 1px 0 rgba(255,255,255,0.1); }
      50%      { box-shadow: 0 0 32px rgba(139,92,246,0.45), inset 0 1px 0 rgba(255,255,255,0.15); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Wordmark ── */
    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(6px);
      animation: wordIn 0.5s ease 0.65s forwards;
    }

    @keyframes wordIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .wordmark-name {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.8px;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      animation: typeIn 0.6s steps(10, end) 0.65s forwards;
    }

    @keyframes typeIn {
      from { width: 0; }
      to   { width: 160px; }
    }

    .wordmark-sub {
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.3);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 0.4s ease 1.2s forwards;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 140px;
      height: 1.5px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.3s ease 1.1s forwards;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8B5CF6, #06B6D4);
      border-radius: 2px;
      animation: load 1.4s cubic-bezier(0.4,0,0.2,1) 1.1s forwards;
    }

    @keyframes load {
      0%   { width: 0%; }
      50%  { width: 60%; }
      80%  { width: 85%; }
      100% { width: 100%; }
    }

    .version {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.5px;
      opacity: 0;
      animation: fadeIn 0.3s ease 1.3s forwards;
    }

    /* ── Ambient light blobs ── */
    .ambient {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }

    .ambient-1 {
      width: 200px;
      height: 200px;
      background: rgba(139,92,246,0.06);
      top: -60px;
      left: -40px;
    }

    .ambient-2 {
      width: 160px;
      height: 160px;
      background: rgba(6,182,212,0.04);
      bottom: -40px;
      right: -20px;
    }
  </style>
</head>
<body>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <div class="orbit-container">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="logo-mark">
      <img src="../assets/icon.png" alt="Spectre">
    </div>
  </div>

  <div class="wordmark">
    <div class="wordmark-name">Spectre AI</div>
    <div class="wordmark-sub">Intelligence Infrastructure</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill"></div>
  </div>

  <div class="version">v1.0.0</div>

  <script>
    setTimeout(() => {
      document.body.classList.add('fade-out');
    }, 2500);
  </script>
</body>
</html>
