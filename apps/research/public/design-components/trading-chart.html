<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=700">
  <title>Spectre — Trading Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #09090b; --bg-surface: #111113; --bg-elevated: #18181b;
      --glass-bg: rgba(9,9,11,0.88); --glass-border: rgba(255,255,255,0.04);
      --text-primary: #f5f5f7; --text-secondary: rgba(245,245,247,0.6);
      --text-tertiary: rgba(245,245,247,0.5); --text-muted: rgba(245,245,247,0.35);
      --bull: #10B981; --bear: #EF4444; --cyan: #06B6D4; --violet: #A78BFA;
      --border-subtle: rgba(255,255,255,0.03); --border-default: rgba(255,255,255,0.04);
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      font-family: var(--font-body);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .widget {
      width: 700px;
      padding: 0;
    }

    /* ---- Glass Card ---- */
    .chart-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02),
        0 8px 40px rgba(0,0,0,0.5),
        0 2px 12px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.03);
    }

    /* ---- Top Toolbar ---- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .token-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
    }

    .token-logo {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F7931A 0%, #E8850C 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      box-shadow: 0 2px 8px rgba(247,147,26,0.25);
      flex-shrink: 0;
    }
    .token-logo svg {
      width: 16px; height: 16px;
    }

    .token-pair {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .token-price {
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--bull);
      letter-spacing: -0.02em;
    }

    /* ---- Toggle Buttons ---- */
    .chart-type-toggles {
      display: flex;
      gap: 2px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 2px;
    }

    .chart-type-btn {
      font-size: 11px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-body);
      letter-spacing: 0.01em;
    }
    .chart-type-btn:hover {
      color: var(--text-secondary);
    }
    .chart-type-btn.active {
      background: rgba(255,255,255,0.08);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    /* ---- Timeframe Pills ---- */
    .timeframe-pills {
      display: flex;
      gap: 2px;
    }

    .tf-pill {
      font-size: 11px;
      font-weight: 500;
      padding: 5px 9px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .tf-pill:hover {
      color: var(--text-secondary);
    }
    .tf-pill.active {
      background: rgba(6,182,212,0.12);
      color: var(--cyan);
      box-shadow: 0 0 8px rgba(6,182,212,0.08);
    }

    /* ---- Chart Area ---- */
    .chart-area {
      position: relative;
      padding: 12px 0 0 0;
      height: 340px;
    }

    .chart-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Grid lines */
    .grid-line {
      stroke: rgba(255,255,255,0.04);
      stroke-dasharray: 3 4;
      stroke-width: 0.5;
    }

    /* Candle styles */
    .candle-body-bull { fill: var(--bull); }
    .candle-body-bear { fill: var(--bear); }
    .candle-wick-bull { stroke: var(--bull); stroke-width: 1; }
    .candle-wick-bear { stroke: var(--bear); stroke-width: 1; }

    /* Volume bars */
    .vol-bull { fill: rgba(16,185,129,0.15); }
    .vol-bear { fill: rgba(239,68,68,0.15); }

    /* Price axis labels */
    .price-label {
      font-family: var(--font-mono);
      font-size: 10px;
      fill: var(--text-muted);
      text-anchor: end;
    }

    /* Time axis labels */
    .time-label {
      font-family: var(--font-mono);
      font-size: 9px;
      fill: var(--text-muted);
      text-anchor: middle;
    }

    /* Current price line */
    .current-price-line {
      stroke: var(--bull);
      stroke-width: 0.8;
      stroke-dasharray: 4 3;
      opacity: 0.6;
    }
    .current-price-tag {
      fill: var(--bull);
    }
    .current-price-text {
      font-family: var(--font-mono);
      font-size: 9.5px;
      fill: #fff;
      font-weight: 600;
    }

    /* ---- Bottom Info Bar ---- */
    .ohlc-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 20px 14px;
      border-top: 1px solid var(--border-subtle);
    }

    .ohlc-item {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }
    .ohlc-label {
      color: var(--text-muted);
      opacity: 0.7;
      margin-right: 4px;
    }
    .ohlc-value {
      color: var(--text-secondary);
    }
  </style>
</head>
