<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=900">
  <title>Spectre — Token Ticker Strip</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #09090b; --bg-surface: #111113; --bg-elevated: #18181b;
      --glass-bg: rgba(9,9,11,0.88); --glass-border: rgba(255,255,255,0.04);
      --text-primary: #f5f5f7; --text-secondary: rgba(245,245,247,0.6);
      --text-muted: rgba(245,245,247,0.35);
      --bull: #10B981; --bear: #EF4444;
      --border-subtle: rgba(255,255,255,0.03); --border-default: rgba(255,255,255,0.04);
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      font-family: var(--font-body);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .widget {
      width: 900px;
      padding: 0;
    }

    /* ---- Ticker Strip ---- */
    .ticker-strip {
      display: flex;
      align-items: center;
      width: 100%;
      height: 52px;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid var(--glass-border);
      border-bottom: 1px solid var(--glass-border);
      box-shadow:
        0 1px 8px rgba(0,0,0,0.12),
        0 4px 24px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.03);
      overflow: hidden;
    }

    /* ---- Token Cell ---- */
    .token-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 0;
      min-width: 0;
      padding: 0 12px;
      height: 100%;
      border-right: 1px solid var(--glass-border);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .token-cell:last-child {
      border-right: none;
    }
    .token-cell:hover {
      background: rgba(255,255,255,0.025);
    }

    /* ---- Brand Dot ---- */
    .brand-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }

    /* ---- Token Info ---- */
    .cell-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .cell-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cell-symbol {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .cell-price {
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .cell-change {
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .cell-change.positive { color: var(--bull); }
    .cell-change.negative { color: var(--bear); }
  </style>
</head>
<body>
  <div class="widget">
    <div class="ticker-strip">

      <!-- BTC -->
      <div class="token-cell">
        <div class="brand-dot" style="background: radial-gradient(circle at 30% 30%, #FBB034, #F7931A);"></div>
        <div class="cell-info">
          <div class="cell-top">
            <span class="cell-symbol">BTC</span>

        </div>
      </div>

    </div>
  </div>
</body>
</html>
