<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectre AI - Trending Bar Component</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .trending-bar-container {
            width: 100%;
            max-width: 1200px;
            background: #0a0a0f;
            padding: 24px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .trending-label {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trending-scroll-wrapper {
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .trending-scroll-wrapper::-webkit-scrollbar {
            height: 6px;
        }

        .trending-scroll-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .trending-scroll-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .trending-scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .trending-items {
            display: flex;
            gap: 12px;
            min-width: min-content;
            padding: 4px 0;
        }

        .trending-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            user-select: none;
        }

        .trending-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .token-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .icon-pepe { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
        .icon-bonk { background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%); }
        .icon-wif { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
        .icon-ondo { background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); }
        .icon-jup { background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); }
        .icon-render { background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%); }
        .icon-ar { background: linear-gradient(135deg, #14B8A6 0%, #0D9488 100%); }
        .icon-fet { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); }

        .token-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .token-name {
            font-size: 13px;
            font-weight: 500;
            color: #f5f5f7;
            line-height: 1.2;
        }

        .token-symbol {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1;
        }

        .token-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 4px;
        }

        .token-price {
            font-size: 13px;
            font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
            color: #f5f5f7;
            line-height: 1.2;
            min-width: 60px;
            text-align: right;
        }

        .token-change {
            font-size: 11px;
            font-weight: 600;
            font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
            line-height: 1.2;
            min-width: 48px;
            text-align: right;
        }

        .change-positive {
            color: #30D158;
        }

        .change-negative {
            color: #FF453A;
        }

        .trending-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            font-size: 12px;
            margin-left: 2px;
        }

        @media (max-width: 768px) {
            .trending-bar-container {
                padding: 16px;
            }

            .token-price {
                font-size: 12px;
            }

            .token-name {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .trending-item {
                padding: 6px 10px;
                gap: 6px;
            }

            .token-icon {
                width: 20px;
                height: 20px;
                font-size: 10px;
            }

            .token-price {
                font-size: 11px;
                min-width: 50px;
            }

            .token-change {
                font-size: 10px;
                min-width: 40px;
            }

            .trending-stats {
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="trending-bar-container">
        <div class="trending-label">🔥 Trending</div>

        <div class="trending-scroll-wrapper">
            <div class="trending-items">
                <!-- PEPE -->
                <div class="trending-item">
                    <div class="token-icon icon-pepe">P</div>
                    <div class="token-info">
                        <div class="token-name">PEPE</div>

                    </div>
                    <div class="token-stats">
                        <div class="token-price">$0.0000089</div>

                <!-- BONK -->

                    <div class="token-stats">

                </div>

                <!-- ONDO -->
                <div class="trending-item">

                    <div class="token-info">
                        <div class="token-name">ONDO</div>

                    </div>
                    <div class="token-stats">
                        <div class="token-price">$1.23</div>
                        <div class="token-change change-positive">+15.2%</div>
                    </div>
                </div>

                <!-- JUP -->
                <div class="trending-item">
                    <div class="token-icon icon-jup">J</div>
                    <div class="token-info">
                        <div class="token-name">JUP</div>
                        <div class="token-symbol">$0.89</div>
                    </div>
                    <div class="token-stats">
                        <div class="token-price">$0.89</div>
                        <div class="token-change change-positive">+12.1%</div>
                    </div>
                </div>

                <!-- RENDER -->
                <div class="trending-item">
                    <div class="token-icon icon-render">R</div>
                    <div class="token-info">
                        <div class="token-name">RENDER</div>

                    </div>
                    <div class="token-stats">
                        <div class="token-price">$7.82</div>

                    </div>
                </div>

                <!-- AR -->
                <div class="trending-item">
                    <div class="token-icon icon-ar">A</div>
                    <div class="token-info">

                    <div class="token-stats">

                    </div>
                </div>

                <!-- FET -->
                <div class="trending-item">
                    <div class="token-icon icon-fet">F</div>
                    <div class="token-info">
                        <div class="token-name">FET</div>
                        <div class="token-symbol">$1.67</div>
                    </div>
                    <div class="token-stats">
                        <div class="token-price">$1.67</div>
                        <div class="token-change change-positive">+8.8%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
