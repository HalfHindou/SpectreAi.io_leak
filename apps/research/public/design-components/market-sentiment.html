<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title>Spectre — Market Sentiment Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #09090b; --bg-surface: #111113; --bg-elevated: #18181b;
      --glass-bg: rgba(9,9,11,0.88); --glass-border: rgba(255,255,255,0.04);
      --text-primary: #f5f5f7; --text-secondary: rgba(245,245,247,0.6);
      --text-tertiary: rgba(245,245,247,0.5); --text-muted: rgba(245,245,247,0.35);
      --bull: #10B981; --bear: #EF4444; --cyan: #06B6D4; --amber: #F59E0B;
      --border-subtle: rgba(255,255,255,0.03); --border-default: rgba(255,255,255,0.04);
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      font-family: var(--font-body);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .widget {
      width: 380px;
      padding: 24px;
    }

    /* --- Glass Card --- */
    .sentiment-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 28px 28px 24px;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 4px 24px rgba(0,0,0,0.12),
        0 20px 60px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
    }
    .sentiment-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    }

    /* --- Header --- */
    .sentiment-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .sentiment-icon {
      width: 32px; height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(239,68,68,0.08));
      border: 1px solid rgba(245,158,11,0.18);
      display: flex; align-items: center; justify-content: center;
    }
    .sentiment-icon svg {
      width: 16px; height: 16px;
    }
    .sentiment-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .sentiment-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bull);
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.15);
      border-radius: 20px;
      padding: 4px 10px;
    }

    /* --- Gauge Container --- */
    .gauge-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }
    .gauge-svg {
      width: 280px;
      height: 165px;
      overflow: visible;
    }

    /* --- Scale Labels --- */
    .scale-labels {
      display: flex;
      justify-content: space-between;
      width: 260px;
      margin-top: 4px;
      margin-bottom: 20px;
    }
    .scale-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.3;
      width: 52px;
    }
    .scale-label.extreme-fear { color: var(--bear); }
    .scale-label.fear { color: #F87171; }
    .scale-label.neutral { color: var(--amber); }
    .scale-label.greed { color: #34D399; }
    .scale-label.extreme-greed { color: var(--bull); }

    /* --- Divider --- */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-border), rgba(255,255,255,0.06), var(--glass-border), transparent);
      margin-bottom: 16px;
    }

    /* --- Metric Rows --- */
    .metrics {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .metric-label {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
    }
    .metric-value {
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-mono);
      letter-spacing: -0.01em;
    }
    .metric-value .delta {
      font-size: 11px;
      font-weight: 500;
      margin-left: 6px;
    }
    .delta.up { color: var(--bull); }
    .delta.down { color: var(--bear); }
    .delta.neutral { color: var(--amber); }

    /* --- Needle animation --- */
    @keyframes needleSwing {
      0%   { transform: rotate(-90deg); }
      100% { transform: rotate(39.6deg); }
    }
    .needle-group {
      transform-origin: 140px 140px;
      animation: needleSwing 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* --- Glow pulse on value --- */
    @keyframes valuePulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .value-glow {
      animation: valuePulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="sentiment-card">

      <!-- Header -->
      <div class="sentiment-header">
        <div class="sentiment-icon">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M8 1.5C4.41 1.5 1.5 4.41 1.5 8s2.91 6.5 6.5 6.5 6.5-2.91 6.5-6.5S11.59 1.5 8 1.5z" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
            <circle cx="5.5" cy="7" r="0.8" fill="#F59E0B"/>
            <circle cx="10.5" cy="7" r="0.8" fill="#F59E0B"/>
            <path d="M5.5 10c.55 1.1 1.4 1.5 2.5 1.5s1.95-.4 2.5-1.5" stroke="#F59E0B" stroke-width="1.1" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <span class="sentiment-label">Market Sentiment</span>
        <span class="sentiment-badge">Live</span>
      </div>

      <!-- Gauge -->
      <div class="gauge-container">
        <svg class="gauge-svg" viewBox="0 0 280 165">
          <defs>
            <!-- Arc gradient: red -> yellow -> green -->
            <linearGradient id="arcGrad" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#EF4444"/>
              <stop offset="25%" stop-color="#F87171"/>
              <stop offset="45%" stop-color="#F59E0B"/>
              <stop offset="55%" stop-color="#FBBF24"/>
              <stop offset="75%" stop-color="#34D399"/>
              <stop offset="100%" stop-color="#10B981"/>
            </linearGradient>
            <!-- Glow filter -->
            <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <!-- Needle shadow -->
            <filter id="needleShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.5)"/>
            </filter>
            <!-- Center glow -->
            <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(16,185,129,0.12)"/>
              <stop offset="100%" stop-color="rgba(16,185,129,0)"/>
            </radialGradient>
          </defs>

          <!-- Background track -->
          <path
            d="M 30 140 A 110 110 0 0 1 250 140"
            fill="none"
            stroke="rgba(255,255,255,0.04)"
            stroke-width="18"
            stroke-linecap="round"
          />

          <!-- Tick marks -->
          <g id="ticks">
            <script type="text/javascript">
              // Generate tick marks programmatically
            </script>
          </g>

          <!-- Colored arc -->
          <path
            d="M 30 140 A 110 110 0 0 1 250 140"
            fill="none"
            stroke="url(#arcGrad)"
            stroke-width="14"
            stroke-linecap="round"
            filter="url(#arcGlow)"
            opacity="0.9"
          />

          <!-- Fine tick marks around the arc -->
          <!-- Major ticks at 0, 20, 40, 60, 80, 100 -->
          <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round">
            <!-- 0 -->
            <line x1="30" y1="140" x2="38" y2="140" transform="rotate(0, 140, 140)" opacity="0"/>
            <!-- Tick 0 (left) -->
            <line x1="36" y1="115" x2="44" y2="119"/>
            <!-- Tick 20 -->
            <line x1="56" y1="62" x2="64" y2="68"/>
            <!-- Tick 40 -->
            <line x1="105" y1="34" x2="109" y2="43"/>
            <!-- Tick 50 (center) -->
            <line x1="140" y1="30" x2="140" y2="40"/>
            <!-- Tick 60 -->
            <line x1="175" y1="34" x2="171" y2="43"/>
            <!-- Tick 80 -->
            <line x1="224" y1="62" x2="216" y2="68"/>
            <!-- Tick 100 (right) -->
            <line x1="244" y1="115" x2="236" y2="119"/>
          </g>
          <!-- Minor ticks -->
          <g stroke="rgba(255,255,255,0.12)" stroke-width="0.8" stroke-linecap="round">
            <line x1="42" y1="90" x2="49" y2="93"/>
            <line x1="47" y1="76" x2="54" y2="80"/>
            <line x1="68" y1="52" x2="74" y2="57"/>
            <line x1="82" y1="43" x2="87" y2="49"/>
            <line x1="97" y1="36" x2="101" y2="44"/>
            <line x1="120" y1="31" x2="122" y2="40"/>
            <line x1="160" y1="31" x2="158" y2="40"/>
            <line x1="183" y1="36" x2="179" y2="44"/>
            <line x1="198" y1="43" x2="193" y2="49"/>
            <line x1="212" y1="52" x2="206" y2="57"/>
            <line x1="233" y1="76" x2="226" y2="80"/>
            <line x1="238" y1="90" x2="231" y2="93"/>
          </g>

          <!-- Center glow circle -->
          <circle cx="140" cy="140" r="50" fill="url(#centerGlow)" class="value-glow"/>

          <!-- Needle: 72/100 maps to angle -->
          <!-- Arc goes from 180deg to 0deg (left to right). 72% = 180 - (72/100)*180 = 50.4deg from positive x.
               In our coordinate system, needle rotation from -90 (pointing left at 0) to +90 (pointing right at 100).
               72/100 => -90 + 72*1.8 = -90 + 129.6 = 39.6deg -->
          <g class="needle-group" filter="url(#needleShadow)">
            <!-- Needle body -->
            <line
              x1="140" y1="140"
              x2="140" y2="48"
              stroke="var(--text-primary)"
              stroke-width="2.2"
              stroke-linecap="round"
              opacity="0.95"
            />
            <!-- Needle tip (brighter) -->
            <line
              x1="140" y1="70"
              x2="140" y2="48"
              stroke="#ffffff"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </g>
          <!-- Center dot -->
          <circle cx="140" cy="140" r="6" fill="var(--bg-elevated)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <circle cx="140" cy="140" r="3" fill="var(--text-primary)" opacity="0.8"/>

          <!-- Value: 72 -->
          <text x="140" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="36" font-weight="700" fill="var(--text-primary)" letter-spacing="-0.03em">72</text>
          <!-- Label: Greed -->
          <text x="140" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#10B981" letter-spacing="0.04em">Greed</text>
        </svg>
      </div>

      <!-- Scale Labels -->
      <div class="scale-labels">
        <span class="scale-label extreme-fear">Extreme<br>Fear</span>
        <span class="scale-label fear">Fear</span>
        <span class="scale-label neutral">Neutral</span>
        <span class="scale-label greed">Greed</span>
        <span class="scale-label extreme-greed">Extreme<br>Greed</span>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Metrics -->
      <div class="metrics">
        <div class="metric-row">
          <span class="metric-label">Yesterday</span>
          <span class="metric-value">
            68
            <span class="delta up">+4</span>
          </span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Last Week</span>
          <span class="metric-value">
            55
            <span class="delta up">+17</span>
          </span>
        </div>
        <div class="metric-row">
          <span class="metric-label">Last Month</span>
          <span class="metric-value">
            42
            <span class="delta up">+30</span>
          </span>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
