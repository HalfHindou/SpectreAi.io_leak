<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectre AI - Category Pills Component</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #0a0a0f;
            padding: 40px;
            border-radius: 12px;
        }

        .title {
            color: #f5f5f7;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
        }

        .pills-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .pills-wrapper::-webkit-scrollbar {
            height: 4px;
        }

        .pills-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .pills-wrapper::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .pills-wrapper::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background-color: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .pill:hover {
            color: rgba(255, 255, 255, 0.65);
            background-color: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .pill.active {
            color: #f5f5f7;
            background-color: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.10);
        }

        .pill.active:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .pill-indicator {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .indicator-white {
            background-color: #ffffff;
        }

        .indicator-blue {
            background-color: #3B82F6;
        }

        .indicator-purple {
            background-color: #8B5CF6;
        }

        .indicator-cyan {
            background-color: #06B6D4;
        }

        .indicator-pink {
            background-color: #EC4899;
        }

        .indicator-orange {
            background-color: #F59E0B;
        }

        .indicator-green {
            background-color: #10B981;
        }

        .indicator-red {
            background-color: #EF4444;
        }

        .indicator-indigo {
            background-color: #6366F1;
        }

        .indicator-gray {
            background-color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Category Filters</div>
        <div class="pills-wrapper">
            <button class="pill active">
                <span class="pill-indicator indicator-white"></span>
                <span>All</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-blue"></span>
                <span>DeFi</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-purple"></span>
                <span>Layer 1</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-cyan"></span>
                <span>Layer 2</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-pink"></span>
                <span>NFTs</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-orange"></span>
                <span>Gaming</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-green"></span>
                <span>AI</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-red"></span>
                <span>Meme</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-indigo"></span>
                <span>Privacy</span>
            </button>
            <button class="pill">
                <span class="pill-indicator indicator-gray"></span>
                <span>Stablecoins</span>
            </button>
        </div>
    </div>

    <script>
        // Add interactivity to pills
        const pills = document.querySelectorAll('.pill');

        pills.forEach(pill => {
            pill.addEventListener('click', function() {
                // Remove active class from all pills
                pills.forEach(p => p.classList.remove('active'));
                // Add active class to clicked pill
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
