<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectre AI - Tab Menu Component</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .component-container {
            background: #0a0a0f;
            border-radius: 16px;
            padding: 24px;
            box-shadow:
                0 0 1px rgba(255, 255, 255, 0.08),
                0 8px 32px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .component-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            display: block;
        }

        .tab-menu-container {
            display: flex;
            gap: 1px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .tab-menu-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .tab-icon {
            width: 13px;
            height: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
        }

        .tab-label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .tab:not(.tab-active) {
            color: rgba(255, 255, 255, 0.35);
            background: transparent;
        }

        .tab:not(.tab-active):hover {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.5);
        }

        .tab-active {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.09) 100%);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #f5f5f7;
        }

        .tab-active:hover {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.12) 100%);
        }

        .demo-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .demo-label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: block;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .color-swatch {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .color-name {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 500;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .color-value {
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
            margin-top: 4px;
            font-family: "SF Mono", monospace;
        }

        .swatch-display {
            width: 100%;
            height: 32px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
    <div class="component-container">
        <span class="component-label">Tab Menu Component</span>

        <div class="tab-menu-container">
            <button class="tab tab-active" aria-selected="true">
                <span class="tab-icon">🤖</span>
                <span class="tab-label">AI Brief</span>
            </button>
            <button class="tab" aria-selected="false">
                <span class="tab-icon">📊</span>
                <span class="tab-label">Market Pulse</span>
            </button>
            <button class="tab" aria-selected="false">
                <span class="tab-icon">📰</span>
                <span class="tab-label">News Wire</span>
            </button>
            <button class="tab" aria-selected="false">
                <span class="tab-icon">⭐</span>
                <span class="tab-label">Watchlist</span>
            </button>
            <button class="tab" aria-selected="false">
                <span class="tab-icon">😱</span>
                <span class="tab-label">Fear & Greed</span>
            </button>
            <button class="tab" aria-selected="false">
                <span class="tab-icon">🪙</span>
                <span class="tab-label">Top Coins</span>
            </button>
        </div>

        <div class="demo-section">
            <span class="demo-label">Design System Colors</span>
            <div class="color-palette">
                <div class="color-swatch">
                    <div class="swatch-display" style="background: #0a0a0f;"></div>
                    <div class="color-name">Background</div>
                    <div class="color-value">#0a0a0f</div>
                </div>
                <div class="color-swatch">
                    <div class="swatch-display" style="background: rgba(255, 255, 255, 0.16);"></div>
                    <div class="color-name">Tab Active (top)</div>
                    <div class="color-value">rgba(255, 255, 255, 0.16)</div>
                </div>
                <div class="color-swatch">
                    <div class="swatch-display" style="background: rgba(255, 255, 255, 0.35);"></div>
                    <div class="color-name">Text Inactive</div>
                    <div class="color-value">rgba(255, 255, 255, 0.35)</div>
                </div>
                <div class="color-swatch">
                    <div class="swatch-display" style="background: #f5f5f7;"></div>
                    <div class="color-name">Text Active</div>
                    <div class="color-value">#f5f5f7</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => {
                    t.classList.remove('tab-active');
                    t.setAttribute('aria-selected', 'false');
                });
                this.classList.add('tab-active');
                this.setAttribute('aria-selected', 'true');
            });
        });
    </script>
</body>
</html>
