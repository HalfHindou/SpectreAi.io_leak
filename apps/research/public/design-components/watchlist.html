<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>Spectre — Watchlist Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #09090b; --bg-surface: #111113; --bg-elevated: #18181b;
      --glass-bg: rgba(9,9,11,0.88); --glass-border: rgba(255,255,255,0.04);
      --text-primary: #f5f5f7; --text-secondary: rgba(245,245,247,0.6);
      --text-tertiary: rgba(245,245,247,0.5); --text-muted: rgba(245,245,247,0.35);
      --bull: #10B981; --bear: #EF4444;
      --border-subtle: rgba(255,255,255,0.03); --border-default: rgba(255,255,255,0.04);
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      font-family: var(--font-body);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .widget {
      width: 280px;
      padding: 20px;
    }

    /* ── Glass Card ── */
    .watchlist-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 4px 24px rgba(0,0,0,0.12),
        0 20px 60px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
    }
    .watchlist-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    }

    /* ── Header ── */
    .wl-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .wl-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }
    .wl-badge {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 2px 8px;
      letter-spacing: 0.02em;
    }
    .wl-sort-btn {
      margin-left: auto;
      width: 26px; height: 26px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .wl-sort-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.1);
    }
    .wl-sort-btn svg {
      width: 12px; height: 12px;
      color: var(--text-muted);
    }

    /* ── Search ── */
    .wl-search {
      margin-bottom: 14px;
    }
    .wl-search-input {
      width: 100%;
      height: 32px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 0 12px 0 32px;
      font-size: 11.5px;
      font-family: var(--font-body);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .wl-search-input::placeholder {
      color: var(--text-muted);
    }
    .wl-search-input:focus {
      border-color: rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
    }
    .wl-search-wrap {
      position: relative;
    }
    .wl-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px; height: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ── Token List ── */
    .wl-list {
      display: flex;
      flex-direction: column;
    }
    .wl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.15s ease;
      border-radius: 6px;
      cursor: pointer;
    }
    .wl-row:last-child {
      border-bottom: none;
    }
    .wl-row:hover {
      background: rgba(255,255,255,0.02);
    }

    /* Drag handle */
    .wl-drag {
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: grab;
      padding: 2px 2px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .wl-row:hover .wl-drag {
      opacity: 1;
    }
    .wl-drag-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .wl-drag-row {
      display: flex;
      gap: 2px;
    }

    /* Avatar */
    .wl-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      position: relative;
    }
    .wl-avatar::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* Token info */
    .wl-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .wl-symbol {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    /* Price + Change */
    .wl-price-col {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      flex-shrink: 0;
    }
    .wl-price {
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-mono);
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .wl-change {
      font-size: 10px;
      font-weight: 500;
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
    }
    .wl-change.bull { color: var(--bull); }
    .wl-change.bear { color: var(--bear); }

    /* ── Footer ── */
    .wl-footer {
      margin-top: 14px;
    }
    .wl-add-btn {
      width: 100%;
      height: 34px;
      background: transparent;
      border: 1px dashed rgba(255,255,255,0.08);
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 500;
      font-family: var(--font-body);
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .wl-add-btn:hover {
      border-color: rgba(255,255,255,0.16);
      color: var(--text-secondary);
      background: rgba(255,255,255,0.02);
    }
    .wl-add-btn svg {
      width: 13px; height: 13px;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="watchlist-card">

      <!-- Header -->
      <div class="wl-header">
        <span class="wl-title">Watchlist</span>
        <span class="wl-badge">8 tokens</span>
        <button class="wl-sort-btn" title="Sort">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M4 5h8M4 8h6M4 11h4"/>
          </svg>
        </button>
      </div>

      <!-- Search -->
      <div class="wl-search">
        <div class="wl-search-wrap">
          <svg class="wl-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7" cy="7" r="4.5"/>
            <path d="M10.5 10.5L14 14"/>
          </svg>
          <input class="wl-search-input" type="text" placeholder="Search tokens...">
        </div>
      </div>

      <!-- Token List -->
      <div class="wl-list">

        <!-- BTC -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #F7931A, #c67510);">B</div>
          <div class="wl-info">
            <span class="wl-symbol">BTC</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$97,842</span>
            <span class="wl-change bull">+2.54%</span>
          </div>
        </div>

        <!-- ETH -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #627EEA, #4a60b8);">E</div>
          <div class="wl-info">
            <span class="wl-symbol">ETH</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$3,421</span>
            <span class="wl-change bull">+3.21%</span>
          </div>
        </div>

        <!-- SOL -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #00FFA3, #00c47e);">S</div>
          <div class="wl-info">
            <span class="wl-symbol">SOL</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$196.40</span>
            <span class="wl-change bear">-1.82%</span>
          </div>
        </div>

        <!-- XRP -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #00AAE4, #0088b8);">X</div>
          <div class="wl-info">
            <span class="wl-symbol">XRP</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$2.45</span>
            <span class="wl-change bull">+5.41%</span>
          </div>
        </div>

        <!-- DOGE -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #C2A633, #9a8428);">D</div>
          <div class="wl-info">
            <span class="wl-symbol">DOGE</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$0.32</span>
            <span class="wl-change bull">+8.21%</span>
          </div>
        </div>

        <!-- AVAX -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #E84142, #b83334);">A</div>
          <div class="wl-info">
            <span class="wl-symbol">AVAX</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$38.50</span>
            <span class="wl-change bear">-2.10%</span>
          </div>
        </div>

        <!-- LINK -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #2A5ADA, #2148ae);">L</div>
          <div class="wl-info">
            <span class="wl-symbol">LINK</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$18.90</span>
            <span class="wl-change bull">+2.81%</span>
          </div>
        </div>

        <!-- DOT -->
        <div class="wl-row">
          <div class="wl-drag">
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
            <div class="wl-drag-row"><span class="wl-drag-dot"></span><span class="wl-drag-dot"></span></div>
          </div>
          <div class="wl-avatar" style="background: linear-gradient(135deg, #E6007A, #b80062);">D</div>
          <div class="wl-info">
            <span class="wl-symbol">DOT</span>
          </div>
          <div class="wl-price-col">
            <span class="wl-price">$7.42</span>
            <span class="wl-change bull">+1.73%</span>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="wl-footer">
        <button class="wl-add-btn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M8 3v10M3 8h10"/>
          </svg>
          Add Token
        </button>
      </div>

    </div>
  </div>
</body>
</html>
