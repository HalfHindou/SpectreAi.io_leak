<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Spectre AI — Offline</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      background: #09090b;
      color: rgba(245, 245, 247, 0.72);
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px);
      min-height: 100vh;
    }
    .offline-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 360px;
    }
    .offline-logo {
      width: 56px;
      height: 56px;
      margin-bottom: 28px;
      opacity: 0.6;
    }
    .offline-heading {
      font-size: 1.25rem;
      font-weight: 500;
      color: #f5f5f7;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    .offline-body {
      font-size: 0.875rem;
      color: rgba(245, 245, 247, 0.48);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .offline-retry {
      padding: 12px 24px;
      background: rgba(245, 245, 247, 0.1);
      color: #f5f5f7;
      border: 1px solid rgba(245, 245, 247, 0.1);
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .offline-retry:hover {
      background: rgba(245, 245, 247, 0.15);
    }
    .offline-retry:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <svg class="offline-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M32 4L58 20V44L32 60L6 44V20L32 4Z" stroke="rgba(245,245,247,0.5)" stroke-width="1.5" fill="none" />
      <path d="M32 4L58 20L32 36L6 20L32 4Z" fill="rgba(245,245,247,0.08)" />
      <path d="M32 36V60L6 44V20L32 36Z" fill="rgba(245,245,247,0.04)" />
      <path d="M32 36V60L58 44V20L32 36Z" fill="rgba(245,245,247,0.06)" />
    </svg>
    <h1 class="offline-heading">You're offline</h1>
    <p class="offline-body">Markets are still moving. Reconnect to see live intelligence.</p>
    <button class="offline-retry" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
