<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="24" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="glow" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="64" cy="58" rx="40" ry="36" fill="url(#glow)"/>
  <!-- Spectre diamond layers -->
  <path d="M64 24L28 58l36 36 36-36L64 24z" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M64 34L38 58l26 26 26-26L64 34z" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M64 44L48 58l16 16 16-16L64 44z" stroke="url(#accent)" stroke-width="3.5" fill="rgba(139,92,246,0.1)"/>
  <!-- Center dot -->
  <circle cx="64" cy="58" r="4" fill="#A78BFA"/>
  <!-- Top edge highlight -->
  <line x1="20" y1="1" x2="108" y2="1" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>
  <!-- SPECTRE text -->
  <text x="64" y="108" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#A78BFA" letter-spacing="3">SPECTRE</text>
