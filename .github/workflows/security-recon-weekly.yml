name: Security Recon (weekly passive surface scan)

# Pure-shell recon ritual from .claude/agents/secy/09-info-disclosure-and-recon.md.
# Subdomain enumeration via crt.sh, exposed-paths sweep, TLS cert SAN check,
# and origin-IP exposure check on spectreai.io. No LLM, no API keys, no cost.
#
# Writes results to .claude/security/recon-YYYY-MM-DD.log and commits the diff.
# Opens an issue tagged "security-recon-drift" if new subdomains or new 200s
# on previously-404 paths appear vs the prior week's log.

on:
  schedule:
    # Mondays at 08:00 UTC — runs before the existing security-audit cron
    # (09:00 UTC same day) so any new surface lands before the npm audit pass.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Manual trigger for ad-hoc runs (e.g. after a known cert rotation).

permissions:
  contents: write       # to commit the recon log
  issues: write         # to open drift-detected issues

jobs:
  recon:
    name: Passive recon ritual against spectreai.io
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq (preinstalled on ubuntu-latest, sanity check)
        run: jq --version && curl --version | head -1 && openssl version

      - name: Run recon ritual
        id: recon
        run: |
          set -euo pipefail
          DOMAIN="spectreai.io"
          OUT_DIR=".claude/security"
          mkdir -p "$OUT_DIR"
          TODAY="$(date -u +%Y-%m-%d)"
          OUT="$OUT_DIR/recon-$TODAY.log"

          {
            echo "# Spectre weekly recon - $TODAY"
            echo "Generated by .github/workflows/security-recon-weekly.yml"
            echo "Source ritual: .claude/agents/secy/09-info-disclosure-and-recon.md section 9.18"
            echo

            echo "## 1. Subdomain enumeration (CT logs via crt.sh)"
            echo '```'
            # crt.sh returns JSON; flatten name_value (can be multiline), dedupe,
            # exclude wildcards (*.spectreai.io) - those are noise.
            curl -fsS --max-time 30 "https://crt.sh/?q=%25.${DOMAIN}&output=json" \
              | jq -r '.[].name_value' 2>/dev/null \
              | tr ',' '\n' \
              | sed 's/^\*\.//' \
              | grep -E "\.${DOMAIN}\$|^${DOMAIN}\$" \
              | sort -u || echo "[crt.sh fetch failed or returned no JSON]"
            echo '```'
            echo

            echo "## 2. Exposed paths sweep on https://${DOMAIN}"
            echo '```'
            for p in \
              /.env /.env.local /.env.production /.env.example \
              /.git/config /.git/HEAD /.git/index \
              /package.json /package-lock.json /yarn.lock \
              /Dockerfile /docker-compose.yml \
              /robots.txt /sitemap.xml \
              /.well-known/security.txt /.well-known/openid-configuration \
              /backup.sql /backup.zip /db.sqlite \
              /admin /admin/login /administrator \
              /api/swagger /api/docs /swagger.json /openapi.json \
              /__debug__ /debug /trace /actuator /actuator/health \
              /server-status /nginx-status; do
              code=$(curl -so /dev/null -w "%{http_code}" --max-time 10 "https://${DOMAIN}${p}" || echo "ERR")
              # Only log non-404s. Vite SPA returns 200 for any path - that's
              # noise. But anything that's NOT 404 and NOT 200 is interesting
              # (401/403 hints at real route, 500 hints at handler crash).
              # 200 we log too because the body might be real content - the
              # secy stack-quirk note (MEMORY.md section F) covers this; a
              # human or secy reviews the body, not us.
              if [ "$code" != "404" ] && [ "$code" != "000" ]; then
                printf "%s %s\n" "$code" "$p"
              fi
            done | sort
            echo '```'
            echo

            echo "## 3. TLS cert SAN check on api.spectreai.io"
            echo '```'
            # Pull the cert via SNI=api.spectreai.io and extract SANs. The known
            # finding (secy SEC-20260513-016) is that this cert lacks the
            # api.spectreai.io SAN. This step tells us when KD/Sunny fix it.
            echo | timeout 10 openssl s_client -servername api.spectreai.io \
              -connect api.spectreai.io:443 2>/dev/null \
              | openssl x509 -noout -text 2>/dev/null \
              | grep -A1 "Subject Alternative Name:" \
              | tail -1 \
              | tr ',' '\n' \
              | sed 's/^ *//' \
              | sort -u \
              || echo "[TLS handshake failed or cert unreadable]"
            echo '```'
            echo

            echo "## 4. Origin IP exposure check"
            echo '```'
            # Cloudflare-proxied subdomains should resolve to CF IPs. A direct
            # A record on a CF-proxied host is the leak that exposes origin
            # for direct attack (bypassing CF WAF + DDoS).
            for sub in dash docs api app; do
              fqdn="${sub}.${DOMAIN}"
              ips=$(dig +short "$fqdn" A | sort -u | tr '\n' ' ')
              printf "%s -> %s\n" "$fqdn" "${ips:-[no A record]}"
            done
            echo '```'
            echo

            echo "## 5. Security headers on https://${DOMAIN}"
            echo '```'
            curl -sI --max-time 10 "https://${DOMAIN}" \
              | grep -iE '^(strict-transport-security|content-security-policy|x-frame-options|x-content-type-options|referrer-policy|permissions-policy|cross-origin-opener-policy|cross-origin-resource-policy):' \
              | sort \
              || echo "[no security headers returned]"
            echo '```'
            echo
            echo "## End of recon - $TODAY"
          } > "$OUT"

          echo "wrote=$OUT" >> "$GITHUB_OUTPUT"
          echo "Recon log:"
          echo "----------"
          cat "$OUT"

      - name: Diff vs prior week's recon log
        id: diff
        run: |
          set -euo pipefail
          OUT_DIR=".claude/security"
          TODAY="$(date -u +%Y-%m-%d)"
          THIS="$OUT_DIR/recon-$TODAY.log"
          # Most recent recon log OTHER than today's
          PREV=$(ls -1t "$OUT_DIR"/recon-*.log 2>/dev/null | grep -v "$THIS" | head -1 || true)

          if [ -z "$PREV" ]; then
            echo "drift=initial" >> "$GITHUB_OUTPUT"
            echo "No prior recon log found - this is the first run, no diff possible."
            exit 0
          fi

          echo "Comparing $THIS vs $PREV"
          # diff exits 0 if same, 1 if different - don't fail the workflow on 1
          if diff -u "$PREV" "$THIS" > recon-diff.txt; then
            echo "drift=none" >> "$GITHUB_OUTPUT"
            echo "No drift since $PREV."
          else
            echo "drift=detected" >> "$GITHUB_OUTPUT"
            {
              echo "Drift detected:"
              echo '```diff'
              cat recon-diff.txt
              echo '```'
            } > recon-diff-summary.md
            cat recon-diff-summary.md
          fi

      - name: Commit recon log to repo
        run: |
          set -euo pipefail
          git config user.name "spectre-recon-bot"
          git config user.email "recon-bot@users.noreply.github.com"
          git add .claude/security/recon-*.log
          if git diff --cached --quiet; then
            echo "No changes to commit (recon log identical to a prior run)."
          else
            git commit -m "recon: weekly passive surface scan $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open drift issue
        if: steps.diff.outputs.drift == 'detected'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('recon-diff-summary.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security recon drift detected ${today}`,
              labels: ['security-recon-drift'],
              body: [
                `Weekly recon ritual detected changes vs the prior week's log.`,
                ``,
                `Review the diff below. Anything unexpected (new subdomain, new 200 on a previously-404 path, missing security header, cert SAN regression) should be triaged.`,
                ``,
                `See the full log at \`.claude/security/recon-${today}.log\` and the secy memory at \`.claude/agent-memory/secy/MEMORY.md\` section F (stack quirks) before flagging false positives.`,
                ``,
                body,
              ].join('\n'),
            });
